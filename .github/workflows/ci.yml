name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  committed-lock:
    name: Committed lock (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: ${{ hashFiles('package-lock.json') != '' }}
        with:
          node-version: 22
      - name: Validate release lock
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: node scripts/release-readiness.js --lockfile-only
      - name: Install committed lock without lifecycle scripts
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci --ignore-scripts
      - name: Verify installed dependency tree
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ls --all
      - name: Audit production and build dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm audit --audit-level=high
      - run: npm run test:syntax
        if: ${{ hashFiles('package-lock.json') != '' }}
      - run: npm test
        if: ${{ hashFiles('package-lock.json') != '' }}
      - run: npm run test:api
        if: ${{ hashFiles('package-lock.json') != '' }}
      - run: npm run test:release
        if: ${{ hashFiles('package-lock.json') != '' }}
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: project
      - name: Detect bootstrap mode
        id: bootstrap_mode
        env:
          BOOTSTRAP_ENABLED: ${{ hashFiles('project/package-lock.json') == '' }}
        run: echo "enabled=$BOOTSTRAP_ENABLED" >> "$GITHUB_OUTPUT"
      - name: Check out reviewed DocFlow packages
        if: ${{ steps.bootstrap_mode.outputs.enabled == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: docflowlocal/docflow
          ref: 9553251ffec02c08a5cf01b242dfcd8f5be30302
          path: docflow-source
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: ${{ steps.bootstrap_mode.outputs.enabled == 'true' }}
        with:
          node-version: 22
      - name: Pack reviewed public dependencies
        if: ${{ steps.bootstrap_mode.outputs.enabled == 'true' }}
        working-directory: docflow-source
        run: |
          mkdir -p "$RUNNER_TEMP/docflow-packages"
          npm pack ./packages/contracts --ignore-scripts --pack-destination "$RUNNER_TEMP/docflow-packages"
          npm pack ./packages/core --ignore-scripts --pack-destination "$RUNNER_TEMP/docflow-packages"
          npm pack ./packages/license-verifier --ignore-scripts --pack-destination "$RUNNER_TEMP/docflow-packages"
      - name: Verify reviewed dependency versions
        if: ${{ steps.bootstrap_mode.outputs.enabled == 'true' }}
        working-directory: project
        run: node -e "const expected={\"@docflow-local/contracts\":\"0.1.0\",\"@docflow-local/core\":\"0.1.1\",\"@docflow-local/license-verifier\":\"0.1.1\"};const packageJson=require(\"./package.json\");for(const [name,version] of Object.entries(expected)){const actual=packageJson.dependencies?.[name];if(actual!==version){throw new Error(name+\" must equal reviewed package version \"+version+\" (found \"+actual+\")\");}}"
      - name: Install dependencies from reviewed tarballs
        if: ${{ steps.bootstrap_mode.outputs.enabled == 'true' }}
        working-directory: project
        run: npm install --ignore-scripts --save-exact --package-lock=true "$RUNNER_TEMP/docflow-packages/docflow-local-contracts-0.1.0.tgz" "$RUNNER_TEMP/docflow-packages/docflow-local-core-0.1.1.tgz" "$RUNNER_TEMP/docflow-packages/docflow-local-license-verifier-0.1.1.tgz"
      - name: Verify installed dependency tree
        if: ${{ steps.bootstrap_mode.outputs.enabled == 'true' }}
        working-directory: project
        run: npm ls --all
      - name: Audit production and build dependencies
        if: ${{ steps.bootstrap_mode.outputs.enabled == 'true' }}
        run: npm audit --audit-level=high
        working-directory: project
      - name: Restore reviewed package metadata
        if: ${{ steps.bootstrap_mode.outputs.enabled == 'true' }}
        working-directory: project
        run: |
          git checkout -- package.json
          rm -f package-lock.json
      - run: npm run test:syntax
        if: ${{ steps.bootstrap_mode.outputs.enabled == 'true' }}
        working-directory: project
      - run: npm test
        if: ${{ steps.bootstrap_mode.outputs.enabled == 'true' }}
        working-directory: project
      - run: npm run test:api
        if: ${{ steps.bootstrap_mode.outputs.enabled == 'true' }}
        working-directory: project
      - run: npm run test:release
        if: ${{ steps.bootstrap_mode.outputs.enabled == 'true' }}
        working-directory: project
